name: Update game data

on:
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC (off the whole-hour rush)
  workflow_dispatch:

permissions:
  contents: write # commit the updated data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fetches arctracker.io's API, compiles it into src/generated/ and
      # downloads changed item images into public/images/items/
      - name: Update data and images
        run: bun run update-data

      - name: Commit changes
        id: commit
        run: |
          git add src/generated public/images
          if git diff --cached --quiet; then
            echo "No changes in arctracker.io data"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F - <<EOF
          data: update from arctracker.io

          $(git diff --cached --stat)
          EOF
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GitHub disables scheduled workflows after 60 days without commits, which
  # happens whenever the data stays unchanged that long. Re-enabling resets
  # that timer. Its own job, so only this step holds actions: write.
  keepalive:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-enable this workflow after 45 quiet days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/$REPO/commits/${{ github.ref_name }}" --jq .commit.committer.date)
          age_days=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            gh api -X PUT "repos/$REPO/actions/workflows/update-data.yml/enable"
            echo "No commits for $age_days days, re-enabled workflow to reset the inactivity timer"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
