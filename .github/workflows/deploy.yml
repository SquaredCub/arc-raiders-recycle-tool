name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call: # from update-data.yml, whose own push can't trigger this workflow

permissions:
  contents: write # gh-pages branch push

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The branch tip, not the triggering commit: when called from
      # update-data.yml, the data commit it just pushed must be included
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium

      - name: Git identity for gh-pages push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # gh-pages clones the repo into its own cache dir and pushes from there,
      # which bypasses the credentials actions/checkout injects into the
      # workspace's git config — so the token must live in the origin URL.
      - name: Authenticate origin for gh-pages
        run: git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Test, build, deploy
        run: bun scripts/deploy.js --ci
